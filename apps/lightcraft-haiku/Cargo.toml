[package]
name = "lightcraft-haiku"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "LightCraft"
path = "src/main.rs"

[features]
default = ["denoise"]
denoise = ["lightcraft-engine/denoise"]
heif = ["lightcraft-codecs/heif"]

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam"] }
lightcraft-ui-egui.workspace = true
lightcraft-codecs.workspace = true
lightcraft-raster.workspace = true
lightcraft-sysmem.workspace = true
lightcraft-haiku-host = { path = "../lightcraft-haiku-host" }
egui.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
rayon.workspace = true
image = { workspace = true, features = ["png"] }

[target.'cfg(target_os = "haiku")'.dependencies]
wgpu.workspace = true
egui-wgpu = { version = "0.37", default-features = false }
pollster.workspace = true

[dev-dependencies]
lightcraft-testkit.workspace = true
